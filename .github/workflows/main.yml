name: DeepSeek Token Hunter

on:
  schedule:
    - cron: '0 */6 * * *'  # هر ۶ ساعت
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Run DeepSeek Hunter (hardcoded tokens)
        run: python deepseek_hunter.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-tokens
          path: deepseek_tokens.txt
